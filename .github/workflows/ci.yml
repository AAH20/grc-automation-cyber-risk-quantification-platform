name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m decisiongraph.cli economics catalog/economics.json --output outputs/economics.json
      - run: python -m decisiongraph.cli risk catalog/risk.json --output outputs/risk.json
      - run: python -m decisiongraph.cli import-ciso-assistant catalog/ciso-assistant-sample.json --output outputs/frameworks.json
      - run: python -m decisiongraph.cli contract catalog/priority-contract.json --output outputs/priority-contract.json
      - run: python -m decisiongraph.cli board-pack catalog/board-decision.json --output outputs/board-pack.json --markdown outputs/board-pack.md

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
